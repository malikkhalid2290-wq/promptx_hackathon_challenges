<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Announcer - Smart Announcement Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #999;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            width: 100%;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .results {
            margin-top: 40px;
            border-top: 2px solid #eee;
            padding-top: 30px;
            display: none;
        }
        .results.show {
            display: block;
        }
        .result-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        .platform-name {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 12px;
            text-transform: uppercase;
        }
        .announcement-text {
            color: #333;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        .copy-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s;
        }
        .copy-btn:hover {
            background: #764ba2;
        }
        .copy-btn.copied {
            background: #28a745;
        }
        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            margin: 20px 0;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 AI Announcer</h1>
        <p class="subtitle">Create intelligent announcements for your team across all platforms</p>
        
        <form id="announcerForm">
            <div class="form-group">
                <label for="announcement">What's the announcement about?</label>
                <textarea id="announcement" placeholder="E.g., New product launch, team event, policy change, etc." required></textarea>
            </div>
            
            <div class="form-group">
                <label for="audience">Target audience</label>
                <input type="text" id="audience" placeholder="E.g., Marketing team, all employees, clients, etc." required>
            </div>
            
            <div class="form-group">
                <label for="tone">Tone</label>
                <select id="tone" required>
                    <option value="">Select tone...</option>
                    <option value="professional">Professional</option>
                    <option value="casual">Casual & Friendly</option>
                    <option value="urgent">Urgent & Important</option>
                    <option value="celebratory">Celebratory & Excited</option>
                </select>
            </div>
            
            <button type="submit">Generate Announcements</button>
        </form>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Creating announcements...</p>
        </div>
        
        <div class="results" id="results">
            <h2 style="color: #333; margin-bottom: 20px;">📢 Your Announcements</h2>
            <div id="resultsContainer"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('announcerForm');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const resultsContainer = document.getElementById('resultsContainer');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const announcement = document.getElementById('announcement').value;
            const audience = document.getElementById('audience').value;
            const tone = document.getElementById('tone').value;
            
            loading.style.display = 'block';
            results.classList.remove('show');
            
            try {
                const response = await fetch("https://api.anthropic.com/v1/messages", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        model: "claude-sonnet-4-20250514",
                        max_tokens: 1000,
                        messages: [
                            {
                                role: "user",
                                content: `You are an expert social media and communication specialist. Create announcements for the following:

Announcement: ${announcement}
Target Audience: ${audience}
Tone: ${tone}

Generate EXACTLY 4 announcements in this JSON format (no other text):
{
  "slack": "announcement for Slack (max 150 chars)",
  "whatsapp": "announcement for WhatsApp (max 160 chars, include emojis)",
  "linkedin": "announcement for LinkedIn (150-200 chars, professional)",
  "email_subject": "email subject line (max 50 chars)"
}

Make sure each is tailored to the platform's style and character limits.`
                            }
                        ]
                    })
                });
                
                const data = await response.json();
                const text = data.content[0].text;
                
                // Extract JSON from response
                const jsonMatch = text.match(/\{[\s\S]*\}/);
                const announcements = JSON.parse(jsonMatch[0]);
                
                // Display results
                displayResults(announcements);
                loading.style.display = 'none';
                results.classList.add('show');
                
            } catch (error) {
                console.error('Error:', error);
                loading.style.display = 'none';
                alert('Error generating announcements. Please try again.');
            }
        });

        function displayResults(announcements) {
            const platforms = [
                { key: 'slack', name: '💬 Slack', icon: '#667eea' },
                { key: 'whatsapp', name: '💚 WhatsApp', icon: '#25D366' },
                { key: 'linkedin', name: '🔵 LinkedIn', icon: '#0A66C2' },
                { key: 'email_subject', name: '✉️ Email Subject', icon: '#EA4335' }
            ];
            
            resultsContainer.innerHTML = '';
            
            platforms.forEach(platform => {
                const div = document.createElement('div');
                div.className = 'result-item';
                div.style.borderLeftColor = platform.icon;
                
                div.innerHTML = `
                    <div class="platform-name">${platform.name}</div>
                    <div class="announcement-text">${announcements[platform.key]}</div>
                    <button class="copy-btn" onclick="copyText('${announcements[platform.key].replace(/'/g, "\\'")}', this)">
                        📋 Copy
                    </button>
                `;
                
                resultsContainer.appendChild(div);
            });
        }

        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.textContent;
                btn.textContent = '✓ Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('copied');
                }, 2000);
            });
        }
    </script>
</body>
</html>
